name: CI

on:
  pull_request:
  push:
    branches: [main, 'takuyamurayama/ai-it']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:manifest
      - run: npm run test:unit
        env:
          NODE_ENV: test
      - run: npm audit --audit-level=high
      - run: NODE_ENV=production npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-results
          path: |
            .context/lint-results.json
            .context/test-results-unit.jsonl

  integration:
    name: PostgreSQL and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-admin-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      REGI_DEV_AUTH: 'true'
      DATABASE_URL: postgresql://regi_app:local-regi-only@localhost:5432/regi
      MIGRATION_DATABASE_URL: postgresql://regi_owner:local-owner-only@localhost:5432/regi
      MAINTENANCE_TEST_DATABASE_URL: postgresql://regi_owner:local-owner-only@localhost:5432/regi
      SANDBOX_TEST_ADMIN_DATABASE_URL: postgresql://postgres:local-admin-only@localhost:5432/postgres
      PYTHON_EXECUTABLE: ${{ github.workspace }}/.context/venv311/bin/python
      JAPANESE_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: forecast/requirements.txt
      - name: PDF and database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-noto-cjk postgresql-client
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Python dependencies
        run: |
          python -m venv .context/venv311
          .context/venv311/bin/pip install -r forecast/requirements.txt
      - name: Separate owner and application roles
        run: |
          psql "$SANDBOX_TEST_ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE regi_owner LOGIN PASSWORD 'local-owner-only' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE regi_app LOGIN PASSWORD 'local-regi-only' NOSUPERUSER NOBYPASSRLS;
          CREATE DATABASE regi OWNER regi_owner;
          SQL
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:manifest
      - run: npm run test:integration
      - run: .context/venv311/bin/python -m unittest discover -s forecast -v
      - run: python -m unittest discover -s tests -p '*_test.py' -v
        env:
          POSTGRES_TEST_CONTAINER: ${{ job.services.postgres.id }}
      - run: NODE_ENV=production npm run build
      - name: Browser tests (API and Web start through Playwright)
        run: npm run test:web
      - run: npm run test:web:manifest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            .context/test-results-integration.jsonl
            .context/browser-results.json
            .context/browser-output

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag regi:ci .

  terraform:
    name: Terraform (${{ matrix.root }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        root: [infra, infra/sandbox]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
      - run: terraform -chdir=${{ matrix.root }} fmt -check
      - run: terraform -chdir=${{ matrix.root }} init -backend=false -input=false
      - run: terraform -chdir=${{ matrix.root }} validate
      - if: matrix.root == 'infra/sandbox'
        run: terraform -chdir=infra/sandbox fmt -check -recursive
      - if: matrix.root == 'infra/sandbox'
        run: terraform -chdir=infra/sandbox test

  secrets:
    name: Source secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install verified gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          mkdir -p .context/tools
          cd .context/tools
          curl --fail --location --silent --show-error --output gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --output checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" '$2 == name {print $1 "  gitleaks.tar.gz"}' checksums.txt > archive.sha256
          test -s archive.sha256
          sha256sum --check archive.sha256
          tar -xzf gitleaks.tar.gz gitleaks
      - run: .context/tools/gitleaks detect --source . --no-git --redact
